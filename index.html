<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Nation One Election Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50" x-data="onoeApp()" x-init="initIcons()">

    <div class="min-h-screen">
        <div class="bg-gradient-to-r from-orange-600 to-blue-800 text-white p-4 sticky top-0 z-40 shadow-lg">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                        <i data-lucide="shield" class="w-6 h-6 text-orange-600"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold" x-text="t().appTitle"></h1>
                        <p class="text-xs opacity-90" x-text="t().appSubtitle"></p>
                    </div>
                </div>
                <button
                    @click="language = (language === 'hindi' ? 'english' : 'hindi'); $nextTick(() => initIcons())"
                    class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded text-xs font-medium transition-all"
                    x-text="language === 'hindi' ? 'English' : 'हिंदी'">
                </button>
            </div>
        </div>

        <div class="p-4 pb-24">
            
            <template x-if="currentScreen === 'home'">
                <div class="space-y-4">
                    <div class="bg-gradient-to-br from-orange-50 to-blue-50 rounded-lg p-6 border-l-4 border-orange-500">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md">
                                <i data-lucide="shield" class="w-6 h-6 text-orange-600"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold text-gray-900" x-text="t().appTitle"></h1>
                                <p class="text-sm text-gray-600" x-text="t().appSubtitle"></p>
                            </div>
                        </div>
                        <p class="text-xs text-gray-600 bg-white/70 p-3 rounded border-l-2 border-blue-500">
                            <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
                            <span x-text="t().disclaimer"></span>
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                            <div class="flex items-center gap-2 mb-2">
                                <i data-lucide="trending-up" class="w-5 h-5 text-green-600"></i>
                                <p class="text-xs text-gray-600" x-text="t().costSaving"></p>
                            </div>
                            <p class="text-2xl font-bold text-green-700" x-text="'₹' + metrics().saving"></p>
                            <p class="text-xs text-gray-500" x-text="t().crores"></p>
                        </div>
                        <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                            <div class="flex items-center gap-2 mb-2">
                                <i data-lucide="bar-chart-3" class="w-5 h-5 text-blue-600"></i>
                                <p class="text-xs text-gray-600" x-text="t().adminScore"></p>
                            </div>
                            <p class="text-2xl font-bold text-blue-700" x-text="metrics().adminScore"></p>
                            <p class="text-xs text-gray-500">/ 100</p>
                        </div>
                        <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                            <div class="flex items-center gap-2 mb-2">
                                <i data-lucide="clock" class="w-5 h-5 text-orange-600"></i>
                                <p class="text-xs text-gray-600" x-text="t().syncIndex"></p>
                            </div>
                            <p class="text-2xl font-bold text-orange-700" x-text="metrics().syncIndex"></p>
                            <p class="text-xs text-gray-500">/ 100</p>
                        </div>
                        <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                            <div class="flex items-center gap-2 mb-2">
                                <i data-lucide="shield" class="w-5 h-5 text-purple-600"></i>
                                <p class="text-xs text-gray-600" x-text="t().govContinuity"></p>
                            </div>
                            <p class="text-2xl font-bold text-purple-700" x-text="metrics().govContinuity"></p>
                            <p class="text-xs text-gray-500">/ 100</p>
                        </div>
                    </div>

                    <button @click="changeScreen('financial')" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white py-4 rounded-lg font-semibold shadow-lg flex items-center justify-center gap-2 hover:from-orange-600 hover:to-orange-700 transition-all">
                        <span x-text="t().startSim"></span>
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>

                    <div class="grid grid-cols-2 gap-3">
                        <button @click="changeScreen('financial')" class="bg-white rounded-lg p-4 shadow border border-gray-200 flex flex-col items-center gap-2"><i data-lucide="calculator" class="w-6 h-6 text-blue-600"></i><p class="text-xs text-gray-700" x-text="t().financial"></p></button>
                        <button @click="changeScreen('admin')" class="bg-white rounded-lg p-4 shadow border border-gray-200 flex flex-col items-center gap-2"><i data-lucide="users" class="w-6 h-6 text-purple-600"></i><p class="text-xs text-gray-700" x-text="t().admin"></p></button>
                        <button @click="changeScreen('governance')" class="bg-white rounded-lg p-4 shadow border border-gray-200 flex flex-col items-center gap-2"><i data-lucide="trending-up" class="w-6 h-6 text-green-600"></i><p class="text-xs text-gray-700" x-text="t().governance"></p></button>
                        <button @click="changeScreen('map')" class="bg-white rounded-lg p-4 shadow border border-gray-200 flex flex-col items-center gap-2"><i data-lucide="globe" class="w-6 h-6 text-orange-600"></i><p class="text-xs text-gray-700" x-text="t().map"></p></button>
                    </div>
                </div>
            </template>

            <template x-if="currentScreen === 'financial'">
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="calculator" class="w-5 h-5 text-blue-600"></i>
                        <span x-text="t().financial"></span>
                    </h2>
                    <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                        <p class="text-sm font-semibold text-gray-700 mb-3" x-text="t().scenarioBuilder"></p>
                        <div class="flex gap-2 mb-4">
                            <button @click="scenarioType = 'full'" :class="scenarioType === 'full' ? 'bg-blue-600 text-white shadow' : 'bg-gray-100 text-gray-700'" class="flex-1 py-2 px-3 rounded text-xs font-medium transition-all" x-text="t().fullSync"></button>
                            <button @click="scenarioType = 'partial'" :class="scenarioType === 'partial' ? 'bg-blue-600 text-white shadow' : 'bg-gray-100 text-gray-700'" class="flex-1 py-2 px-3 rounded text-xs font-medium transition-all" x-text="t().partialSync"></button>
                            <button @click="scenarioType = 'current'" :class="scenarioType === 'current' ? 'bg-blue-600 text-white shadow' : 'bg-gray-100 text-gray-700'" class="flex-1 py-2 px-3 rounded text-xs font-medium transition-all" x-text="t().current"></button>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                        <p class="text-sm font-semibold text-gray-700 mb-3" x-text="t().estimatedCost"></p>
                        <div class="space-y-3">
                            <div>
                                <div class="flex justify-between text-xs mb-1">
                                    <span class="text-gray-600" x-text="t().currentSystem"></span>
                                    <span class="font-semibold text-gray-900" x-text="'₹' + metrics().baselineCost + ' ' + t().crores"></span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-red-500 h-2 rounded-full" style="width: 100%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs mb-1">
                                    <span class="text-gray-600" x-text="t().synchronized"></span>
                                    <span class="font-semibold text-green-700" x-text="'₹' + metrics().syncCost + ' ' + t().crores"></span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-green-500 h-2 rounded-full" :style="'width: ' + (metrics().syncCost / metrics().baselineCost * 100) + '%'"></div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-200">
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-gray-600" x-text="t().longTermSaving + ' (10 ' + t().years + ')'"></span>
                                <span class="text-xl font-bold text-green-600" x-text="'₹' + (metrics().saving * 2) + ' ' + t().crores"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="currentScreen === 'admin'">
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-purple-600"></i>
                        <span x-text="t().admin"></span>
                    </h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                            <p class="text-xs text-gray-600 mb-2" x-text="t().currentSystem"></p>
                            <p class="text-2xl font-bold text-red-600">245</p>
                            <p class="text-xs text-gray-500" x-text="t().days + ' MCC'"></p>
                        </div>
                        <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                            <p class="text-xs text-gray-600 mb-2" x-text="t().synchronized"></p>
                            <p class="text-2xl font-bold text-green-600">45</p>
                            <p class="text-xs text-gray-500" x-text="t().days + ' MCC'"></p>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg p-4 shadow border border-gray-200 space-y-4">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm text-gray-700" x-text="t().staffDeployment"></span>
                                <span class="text-sm font-semibold text-green-700">-62%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3"><div class="bg-green-500 h-3 rounded-full" style="width: 38%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm text-gray-700" x-text="t().securityForces"></span>
                                <span class="text-sm font-semibold text-green-700">-58%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3"><div class="bg-green-500 h-3 rounded-full" style="width: 42%"></div></div>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="currentScreen === 'map'">
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="globe" class="w-5 h-5 text-orange-600"></i>
                        <span x-text="t().map"></span>
                    </h2>
                    <div class="bg-white rounded-lg p-4 shadow border border-gray-200">
                        <div class="bg-gradient-to-br from-orange-100 to-blue-100 rounded-lg h-48 flex items-center justify-center border-2 border-dashed border-gray-300">
                            <div class="text-center">
                                <i data-lucide="map-pin" class="w-12 h-12 mx-auto text-orange-600 mb-2"></i>
                                <p class="text-sm text-gray-600">भारत का नक्शा</p>
                                <p class="text-xs text-gray-500 mt-1">राज्य चुनने के लिए नीचे सूची देखें</p>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <template x-for="state in states" :key="state.name">
                            <button @click="selectedState = state" class="w-full bg-white rounded-lg p-4 shadow border border-gray-200 hover:shadow-md transition-all text-left">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm font-semibold text-gray-900" x-text="state.name"></span>
                                    <span :class="state.impact === 'high' ? 'bg-red-100 text-red-700' : state.impact === 'medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'" class="px-2 py-1 rounded text-xs font-semibold" x-text="state.admin"></span>
                                </div>
                                <div class="flex items-center justify-between text-xs text-gray-600">
                                    <span x-text="'वित्तीय प्रभाव: ₹' + state.financial + ' ' + t().crores"></span>
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="currentScreen === 'governance'">
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-5 h-5 text-green-600"></i>
                        <span x-text="t().governance"></span>
                    </h2>
                    <div class="bg-white rounded-lg p-6 shadow border border-gray-200">
                        <div class="text-center mb-4">
                            <p class="text-sm text-gray-600 mb-2">समग्र दक्षता सूचकांक</p>
                            <div class="relative inline-block">
                                <svg class="w-32 h-32">
                                    <circle cx="64" cy="64" r="56" fill="none" stroke="#e5e7eb" stroke-width="8" />
                                    <circle cx="64" cy="64" r="56" fill="none" stroke="#10b981" stroke-width="8" 
                                        stroke-dasharray="351.85" 
                                        :stroke-dashoffset="351.85 * (1 - metrics().adminScore / 100)"
                                        transform="rotate(-90 64 64)" stroke-linecap="round" />
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <span class="text-3xl font-bold text-green-600" x-text="metrics().adminScore"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
             </template>
        </div>

        <template x-if="selectedState">
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" @click="selectedState = null">
                <div class="bg-white rounded-lg p-6 max-w-sm w-full" @click.stop>
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-lg font-bold text-gray-900" x-text="selectedState.name"></h3>
                        <button @click="selectedState = null" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                    </div>
                    <div class="space-y-3">
                        <div class="bg-gray-50 rounded p-3">
                            <p class="text-xs text-gray-600 mb-1">प्रशासनिक प्रभाव</p>
                            <p class="text-lg font-bold text-gray-900" x-text="selectedState.admin"></p>
                        </div>
                        <div class="bg-gray-50 rounded p-3">
                            <p class="text-xs text-gray-600 mb-1">वित्तीय प्रभाव</p>
                            <p class="text-lg font-bold text-gray-900" x-text="'₹' + selectedState.financial + ' ' + t().crores"></p>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg">
            <div class="flex justify-around p-2">
                <button @click="changeScreen('home')" :class="currentScreen === 'home' ? 'text-orange-600 bg-orange-50' : 'text-gray-600'" class="flex flex-col items-center gap-1 p-2 rounded transition-all">
                    <i data-lucide="home" class="w-5 h-5"></i><span class="text-xs font-medium" x-text="t().home"></span>
                </button>
                <button @click="changeScreen('financial')" :class="currentScreen === 'financial' ? 'text-orange-600 bg-orange-50' : 'text-gray-600'" class="flex flex-col items-center gap-1 p-2 rounded transition-all">
                    <i data-lucide="calculator" class="w-5 h-5"></i><span class="text-xs font-medium" x-text="t().financial"></span>
                </button>
                <button @click="changeScreen('admin')" :class="currentScreen === 'admin' ? 'text-orange-600 bg-orange-50' : 'text-gray-600'" class="flex flex-col items-center gap-1 p-2 rounded transition-all">
                    <i data-lucide="users" class="w-5 h-5"></i><span class="text-xs font-medium" x-text="t().admin"></span>
                </button>
                <button @click="changeScreen('governance')" :class="currentScreen === 'governance' ? 'text-orange-600 bg-orange-50' : 'text-gray-600'" class="flex flex-col items-center gap-1 p-2 rounded transition-all">
                    <i data-lucide="trending-up" class="w-5 h-5"></i><span class="text-xs font-medium" x-text="t().governance"></span>
                </button>
                <button @click="changeScreen('map')" :class="currentScreen === 'map' ? 'text-orange-600 bg-orange-50' : 'text-gray-600'" class="flex flex-col items-center gap-1 p-2 rounded transition-all">
                    <i data-lucide="globe" class="w-5 h-5"></i><span class="text-xs font-medium" x-text="t().map"></span>
                </button>
            </div>
        </div>

        <div class="fixed bottom-16 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent p-4 pointer-events-none">
            <div class="text-center text-xs text-gray-500">
                <p x-text="t().dataSource + ': EC India, Finance Ministry'"></p>
                <p class="mt-1" x-text="t().methodology + ': Simulation-based Analysis'"></p>
            </div>
        </div>
    </div>

    <script>
        function onoeApp() {
            return {
                language: 'hindi',
                currentScreen: 'home',
                scenarioType: 'full',
                selectedState: null,
                states: [
                    { name: 'महाराष्ट्र', impact: 'high', financial: '3200', admin: 'उच्च' },
                    { name: 'उत्तर प्रदेश', impact: 'high', financial: '4100', admin: 'उच्च' },
                    { name: 'कर्नाटक', impact: 'medium', financial: '1800', admin: 'मध्यम' },
                    { name: 'पश्चिम बंगाल', impact: 'medium', financial: '2200', admin: 'मध्यम' },
                    { name: 'तमिलनाडु', impact: 'medium', financial: '1900', admin: 'मध्यम' },
                    { name: 'गोवा', impact: 'low', financial: '120', admin: 'निम्न' }
                ],
                content: {
                    hindi: {
                        appTitle: 'एक राष्ट्र एक चुनाव', appSubtitle: 'प्रभाव और व्यवहार्यता विश्लेषक',
                        home: 'मुख्य पृष्ठ', financial: 'वित्तीय प्रभाव', admin: 'प्रशासनिक भार',
                        governance: 'शासन दक्षता', legal: 'संवैधानिक तत्परता', map: 'राज्यवार प्रभाव',
                        startSim: 'सिमुलेशन शुरू करें', costSaving: 'अनुमानित लागत बचत',
                        adminScore: 'प्रशासनिक दक्षता स्कोर', syncIndex: 'चुनाव समन्वय सूचकांक',
                        govContinuity: 'शासन निरंतरता स्तर', disclaimer: 'यह एक सूचनात्मक विश्लेषण उपकरण है। सभी डेटा अनुमानित और सिमुलेशन आधारित हैं।',
                        currentSystem: 'वर्तमान प्रणाली', synchronized: 'समन्वित चुनाव',
                        estimatedCost: 'अनुमानित खर्च', longTermSaving: 'दीर्घकालिक बचत',
                        staffDeployment: 'कर्मचारी तैनाती', securityForces: 'सुरक्षा बल उपयोग',
                        mccDuration: 'आचार संहिता अवधि', policySpeed: 'नीति कार्यान्वयन गति',
                        projectDelay: 'परियोजना विलंब', govStability: 'शासन स्थिरता',
                        constAmendment: 'आवश्यक संवैधानिक संशोधन', riskLevel: 'जोखिम स्तर',
                        scenarioBuilder: 'परिदृश्य निर्माता', fullSync: 'पूर्ण समन्वय',
                        partialSync: 'आंशिक समन्वय', current: 'वर्तमान', compare: 'तुलना करें',
                        methodology: 'कार्यप्रणाली', dataSource: 'डेटा स्रोत', selectState: 'राज्य चुनें',
                        impact: 'प्रभाव', high: 'उच्च', medium: 'मध्यम', low: 'निम्न',
                        years: 'वर्ष', crores: 'करोड़', days: 'दिन', percentage: 'प्रतिशत'
                    },
                    english: {
                        appTitle: 'CHUNAV SANGAM ', appSubtitle: 'Impact & Feasibility Analyzer For ONOE',
                        home: 'Home', financial: 'Financial Impact', admin: 'Admin Load',
                        governance: 'Governance Efficiency', legal: 'Constitutional Readiness', map: 'State-wise Impact',
                        startSim: 'Start Simulation', costSaving: 'Estimated Cost Saving',
                        adminScore: 'Administrative Efficiency Score', syncIndex: 'Election Synchronization Index',
                        govContinuity: 'Governance Continuity Level', disclaimer: 'This is an informational analysis tool. All data is estimated and simulation-based.',
                        currentSystem: 'Current System', synchronized: 'Synchronized Elections',
                        estimatedCost: 'Estimated Cost', longTermSaving: 'Long-term Savings',
                        staffDeployment: 'Staff Deployment', securityForces: 'Security Forces Usage',
                        mccDuration: 'MCC Duration', policySpeed: 'Policy Implementation Speed',
                        projectDelay: 'Project Delay', govStability: 'Governance Stability',
                        constAmendment: 'Required Constitutional Amendment', riskLevel: 'Risk Level',
                        scenarioBuilder: 'Scenario Builder', fullSync: 'Full Synchronization',
                        partialSync: 'Partial Synchronization', current: 'Current', compare: 'Compare',
                        methodology: 'Methodology', dataSource: 'Data Source', selectState: 'Select State',
                        impact: 'Impact', high: 'High', medium: 'Medium', low: 'Low',
                        years: 'Years', crores: 'Crores', days: 'Days', percentage: 'Percentage'
                    }
                },
                t() { return this.content[this.language]; },
                metrics() {
                    const baselineCost = 45000;
                    const syncCost = this.scenarioType === 'full' ? 25000 : 35000;
                    return {
                        saving: baselineCost - syncCost,
                        adminScore: this.scenarioType === 'full' ? 85 : 72,
                        syncIndex: this.scenarioType === 'full' ? 92 : 75,
                        govContinuity: this.scenarioType === 'full' ? 88 : 78,
                        baselineCost, syncCost
                    };
                },
                changeScreen(s) {
                    this.currentScreen = s;
                    this.$nextTick(() => lucide.createIcons());
                },
                initIcons() {
                    lucide.createIcons();
                }
            }
        }
    </script>
</body>
</html>
