<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heatmap</title>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
[x-cloak]{display:none}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    Roboto,Helvetica,Arial,sans-serif
}
</style>
</head>

<body class="bg-gray-50" x-data="heatmapApp()" x-init="initIcons()">

<!-- HEADER -->
<div class="bg-gradient-to-r from-orange-600 to-blue-800 text-white p-4 shadow-lg sticky top-0 z-40">
    <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                <i data-lucide="layers" class="w-6 h-6 text-orange-600"></i>
            </div>
            <div>
                <h1 class="text-base font-bold" x-text="t().title"></h1>
                <p class="text-xs opacity-90" x-text="t().subtitle"></p>
            </div>
        </div>
        <button
            @click="language = language==='english'?'hindi':'english'; $nextTick(()=>initIcons())"
            class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded text-xs">
            <span x-text="language==='english'?'हिंदी':'English'"></span>
        </button>
    </div>
</div>

<div class="p-4 pb-24 space-y-4">

<!-- DISCLAIMER -->
<div class="bg-white rounded-lg p-4 shadow border-l-4 border-orange-500 text-xs text-gray-600">
    <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
    <span x-text="t().disclaimer"></span>
</div>

<!-- LEGEND -->
<div class="bg-white rounded-lg p-4 shadow">
    <p class="text-sm font-semibold mb-3" x-text="t().legend"></p>
    <div class="flex gap-4 text-xs">
        <div class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500 rounded"></span><span x-text="t().high"></span></div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 bg-yellow-400 rounded"></span><span x-text="t().medium"></span></div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 bg-green-500 rounded"></span><span x-text="t().low"></span></div>
    </div>
</div>

<!-- HEATMAP GRID -->
<div class="bg-white rounded-lg p-4 shadow">
    <p class="text-sm font-semibold mb-3" x-text="t().mapTitle"></p>

    <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
        <template x-for="state in states" :key="state.name">
            <button
                @click="selectedState = state"
                class="rounded-lg p-3 text-left text-white shadow-md transition transform hover:scale-[1.03]"
                :class="state.level==='High'
                    ?'bg-gradient-to-br from-red-500 to-red-700'
                    :state.level==='Medium'
                    ?'bg-gradient-to-br from-yellow-400 to-yellow-600'
                    :'bg-gradient-to-br from-green-500 to-green-700'">
                <p class="text-xs font-semibold leading-tight" x-text="state.name"></p>
                <p class="text-[10px] opacity-90 mt-1" x-text="state.level"></p>
            </button>
        </template>
    </div>
</div>

</div>

<!-- MODAL -->
<template x-if="selectedState">
<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" @click="selectedState=null">
    <div class="bg-white rounded-lg p-6 w-full max-w-sm" @click.stop>
        <div class="flex justify-between mb-3">
            <h3 class="font-bold text-lg" x-text="selectedState.name"></h3>
            <button @click="selectedState=null" class="text-xl text-gray-400">&times;</button>
        </div>

        <div class="space-y-3 text-sm">
            <div>
                <p class="text-xs text-gray-500" x-text="t().complexity"></p>
                <p class="font-semibold" x-text="selectedState.level"></p>
            </div>
            <div>
                <p class="text-xs text-gray-500" x-text="t().articles"></p>
                <p x-text="selectedState.articles"></p>
            </div>
            <div>
                <p class="text-xs text-gray-500" x-text="t().type"></p>
                <p x-text="selectedState.changeType"></p>
            </div>
        </div>
    </div>
</div>
</template>

<script>
function heatmapApp(){
return{
language:'english',
selectedState:null,

// North → South ordering (approximate, intentional)
states:[
{name:'Jammu & Kashmir',level:'High',articles:'Articles 83, 172',changeType:'Constitutional'},
{name:'Ladakh',level:'Medium',articles:'Administrative Rules',changeType:'Parliament Law'},
{name:'Himachal Pradesh',level:'Medium',articles:'RPA Provisions',changeType:'Parliament Law'},
{name:'Punjab',level:'High',articles:'Articles 172',changeType:'Constitutional'},
{name:'Haryana',level:'Medium',articles:'Election Laws',changeType:'Parliament Law'},
{name:'Delhi (NCT)',level:'High',articles:'Articles 239AA',changeType:'Constitutional'},
{name:'Rajasthan',level:'Medium',articles:'RPA Provisions',changeType:'Parliament Law'},

{name:'Uttarakhand',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Uttar Pradesh',level:'High',articles:'Articles 83, 172',changeType:'Constitutional'},
{name:'Madhya Pradesh',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Chhattisgarh',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},

{name:'Bihar',level:'High',articles:'Articles 172',changeType:'Constitutional'},
{name:'Jharkhand',level:'Medium',articles:'RPA Provisions',changeType:'Parliament Law'},
{name:'West Bengal',level:'High',articles:'Articles 172',changeType:'Constitutional'},
{name:'Odisha',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},

{name:'Gujarat',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Maharashtra',level:'High',articles:'Articles 172, 324',changeType:'Constitutional'},
{name:'Goa',level:'Low',articles:'EC Rules',changeType:'EC Notification'},

{name:'Assam',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Arunachal Pradesh',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Meghalaya',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Manipur',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Mizoram',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Nagaland',level:'Medium',articles:'Special Provisions',changeType:'Constitutional'},
{name:'Tripura',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Sikkim',level:'Low',articles:'Special Provisions',changeType:'Constitutional'},

{name:'Telangana',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Andhra Pradesh',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Karnataka',level:'Medium',articles:'Election Acts',changeType:'Parliament Law'},
{name:'Kerala',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Tamil Nadu',level:'Medium',articles:'EC Scheduling',changeType:'EC Notification'},

{name:'Puducherry',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Andaman & Nicobar',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Lakshadweep',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Chandigarh',level:'Low',articles:'EC Rules',changeType:'EC Notification'},
{name:'Daman & Diu / Dadra & Nagar Haveli',level:'Low',articles:'EC Rules',changeType:'EC Notification'}
],

content:{
english:{
title:'Heatmap',
subtitle:'Constitutional & Legislative Readiness',
disclaimer:'Indicative, simulation-based comparison. Not legal advice.',
legend:'Complexity Legend',
high:'High',
medium:'Medium',
low:'Low',
mapTitle:'State-wise Complexity Heatmap',
complexity:'Complexity Level',
articles:'Affected Provisions',
type:'Change Type'
},
hindi:{
title:'हीटमैप',
subtitle:'संवैधानिक और विधायी तत्परता',
disclaimer:'यह केवल सिमुलेशन आधारित तुलना है।',
legend:'जटिलता संकेत',
high:'उच्च',
medium:'मध्यम',
low:'निम्न',
mapTitle:'राज्यवार जटिलता हीटमैप',
complexity:'जटिलता स्तर',
articles:'प्रभावित प्रावधान',
type:'परिवर्तन प्रकार'
}
},

t(){return this.content[this.language]},
initIcons(){lucide.createIcons()}
}}
</script>

</body>
</html>
